services:
  - type: web
    name: gims-haldwani-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://gims-haldwani.onrender.com
      - key: SEED_ADMIN_NAME
        value: Admin
      - key: SEED_ADMIN_EMAIL
        value: admin@gimshaldwani.edu
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: gims-haldwani
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://gims-haldwani-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
